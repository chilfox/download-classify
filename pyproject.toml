[project]
name = "download-classify-readiness"
version = "0.1.0"
description = "Minimal local API baseline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pypdf>=6.20.0,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
model-check = ["gliner2", "torch", "transformers"]
test = ["httpx2>=2,<3", "pytest>=8.3,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
